[project]
name = "postgresql-migration-pipeline"
version = "1.0.0"
description = "A safe, transactional PostgreSQL migration gate for staging deployments"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Suraj Panda" }]
dependencies = [
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
]

[project.scripts]
postgres-migrate = "migration_pipeline.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/migration_pipeline"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "integration: requires TEST_DATABASE_URL pointing to a disposable PostgreSQL database",
]
